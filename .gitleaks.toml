[[rules]]
id = "hardcoded-password"
description = "Detects hardcoded passwords in quotes"
regex = '''(?i)password\s*=\s*(?:"[^"]{6,}"|'[^']{6,}')'''
entropy = 0.0
tags = ["password"]

  [rules.allowlist]
  regexes = [
    # variable concatenation - password='+var+' or password="+var+"
    '''(?i)password\s*=\s*['"]\s*\+\s*\w+\s*\+''',
    # f-strings and format strings - password=f'{var}' or password="{var}"
    '''(?i)password\s*=\s*(?:f?["'])[^"']*\{[^}]+\}[^"']*["']''',
    # placeholders
    '''(?i)password\s*=\s*(?:"[^"]*"|'[^']*')(removed|placeholder|example|your.password|changeme|xxxx|dummy|test|fake|none|null|enter|insert|add|put|type)'''
  ]

[[rules]]
id = "hardcoded-api-key"
description = "Detects hardcoded API keys in quotes"
regex = '''(?i)(api_key|apikey)\s*=\s*(?:"[^"]{16,}"|'[^']{16,}')'''
entropy = 0.0
tags = ["api-key"]

  [rules.allowlist]
  regexes = [
    '''(?i)(api_key|apikey)\s*=\s*(?:"[^"]*"|'[^']*')(your.api.key|placeholder|example|changeme|xxxx|dummy|test|fake|none|null)'''
  ]

[[rules]]
id = "hardcoded-secret"
description = "Detects hardcoded secrets and tokens in quotes"
regex = '''(?i)\b(secret|token|secret_key|auth_token|access_token)\s*=\s*(?:"[^"]{8,}"|'[^']{8,}')'''
entropy = 0.0
tags = ["secret"]

  [rules.allowlist]
  regexes = [
    '''(?i)\b(secret|token|secret_key|auth_token|access_token)\s*=\s*(?:"[^"]*"|'[^']*')(removed|placeholder|example|changeme|xxxx|dummy|test|fake|none|null)'''
  ]

[[rules]]
id = "cli-password-arg"
description = "Detects hardcoded password in CLI arguments"
regex = '''(?i)"--password"\s*,\s*(?:"[^"]{6,}"|'[^']{6,}')'''
entropy = 0.0
tags = ["password", "cli"]

  [rules.allowlist]
  regexes = [
    '''(?i)(placeholder|example|changeme|dummy|test|fake|none|null)'''
  ]

[[rules]]
id = "stdin-write-secret"
description = "Detects hardcoded secrets written to stdin"
regex = '''(?i)stdin\.write\s*\(\s*(?:"[^"\s]{6,}"|'[^'\s]{6,}')'''
entropy = 0.0
tags = ["password", "stdin"]

  [rules.allowlist]
  regexes = [
    '''(?i)(placeholder|example|changeme|dummy|test|fake|none|null)'''
  ]

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["github", "pat"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws"]

[allowlist]
paths = [
  '''node_modules''',
  '''vendor''',
  '''\.gitleaks\.toml''',
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''\.md$''',
]