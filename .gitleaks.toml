[[rules]]
id = "generic-password"
description = "Detects generic password assignments"
regex = '''(?i)password\s*=\s*["']?[^\s"']{8,}["']?'''
entropy = 0.0
tags = ["password", "generic"]

  [rules.allowlist]
  regexes = [
    '''(?i)password\s*=\s*process\.env\.\w+''',
    '''(?i)password\s*=\s*os\.environ''',
    '''(?i)password\s*=\s*os\.getenv''',
    '''(?i)password\s*=\s*\$\{\w+\}''',
    '''(?i)password\s*=\s*\$\(\w+\)''',
    '''(?i)password\s*=\s*["']?(removed|placeholder|example|your.password|changeme|xxxx|dummy|test|fake)["']?'''
  ]

[[rules]]
id = "cli-password-arg"
description = "Detects password passed as CLI argument"
regex = '''(?i)["\s]--password["']?\s*,\s*["']([^"'\s]{6,})["']'''
entropy = 0.0
tags = ["password", "cli"]

  [rules.allowlist]
  regexes = [
    '''(?i)(placeholder|example|changeme|xxxx|dummy|test|fake|your)'''
  ]

[[rules]]
id = "stdin-write-secret"
description = "Detects secrets written to stdin"
regex = '''(?i)stdin\.write\s*\(\s*["']([^"'\s]{6,})'''
entropy = 0.0
tags = ["password", "stdin"]

  [rules.allowlist]
  regexes = [
    '''(?i)(placeholder|example|changeme|xxxx|dummy|test|fake|your)'''
  ]

[[rules]]
id = "generic-api-key"
description = "Detects generic API key assignments"
regex = '''(?i)(api_key|apikey)\s*=\s*\S{16,}'''
entropy = 0.0
tags = ["api-key", "generic"]

  [rules.allowlist]
  regexes = [
    '''(?i)(your.api.key|goes.here|placeholder|example|changeme|xxxx|dummy|test|fake)'''
  ]

[[rules]]
id = "generic-secret"
description = "Detects generic secret/key assignments"
regex = '''(?i)(secret|token|key|credential|auth)\s*=\s*\S{8,}'''
entropy = 0.0
tags = ["secret", "generic"]

  [rules.allowlist]
  regexes = [
    '''(?i)(secret|token|key)\s*=\s*process\.env\.\w+''',
    '''(?i)(secret|token|key)\s*=\s*os\.environ''',
    '''(?i)(secret|token|key)\s*=\s*os\.getenv''',
    '''(?i)(secret|token|key)\s*=\s*\$\{\w+\}''',
    '''(?i)(secret|token|key)\s*=\s*["']?(removed|placeholder|example|changeme|xxxx|dummy|test|fake|your)["']?'''
  ]

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["github", "pat"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws"]

[allowlist]
paths = [
  '''node_modules''',
  '''vendor''',
  '''\.gitleaks\.toml''',
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''\.md$''',
]