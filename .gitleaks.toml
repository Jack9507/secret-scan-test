[[rules]]
id = "generic-password"
regex = '''(?i)password\s*=\s*["']?[^\s"']{8,}["']?'''
entropy = 0.0
tags = ["password", "generic"]

  [rules.allowlist]
  regexes = [
    '''(?i)password\s*=\s*process\.env\.\w+''',         # ← process.env.X
    '''(?i)password\s*=\s*os\.environ''',                # ← Python os.environ
    '''(?i)password\s*=\s*os\.getenv''',                 # ← Python os.getenv
    '''(?i)password\s*=\s*\$\{\w+\}''',                 # ← ${VARIABLE}
    '''(?i)password\s*=\s*\$\(\w+\)''',                 # ← $(variable)
    '''(?i)password\s*=\s*["']?(removed|placeholder|example|your.password|changeme|xxxx|dummy|test|fake)["']?'''
  ]

[[rules]]
id = "generic-api-key"
regex = '''(?i)(api_key|apikey)\s*=\s*\S{16,}'''
entropy = 0.0
tags = ["api-key", "generic"]

  [rules.allowlist]
  regexes = [
    '''(?i)(your.api.key|goes.here|placeholder|example|changeme|xxxx|dummy|test|fake)'''
  ]

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["github", "pat"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws"]

# Global allowlist - skip these paths entirely
[allowlist]
paths = [
  '''node_modules''',         # ← never scan node_modules
  '''vendor''',               # ← never scan vendor (Python/PHP)
  '''\.gitleaks\.toml''',     # ← never scan config itself
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''\.md$''',                # ← skip markdown docs (has examples)
]