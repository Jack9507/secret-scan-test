name: GitLeaks action to scan generic secrets in repo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    scan:
        name: gitleaks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                config-path: .gitleaks.toml
    getsecrets:
        name: print-env
        runs-on: ubuntu-latest
        environment: dev
        steps:
          - name: GET Environment Secrets
            run: echo "Environment Secret is -> ${{secrets.MY_SECRET}}" 
            